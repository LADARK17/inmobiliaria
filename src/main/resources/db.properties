# ==========================================================
# CONFIGURACIÓN DE CONEXIÓN A BASE DE DATOS (JDBC)
# Centralizada para alternar entre LOCAL (XAMPP) y PRODUCCIÓN
# ==========================================================

# Conexión Local (XAMPP por defecto: root sin contraseña)
db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/inmobiliaria_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Bogota&characterEncoding=UTF-8
db.user=root
db.password=

# Opciones de Pool o Límites de Conexión
db.pool.maxConnections=10
db.pool.timeoutSeconds=5
